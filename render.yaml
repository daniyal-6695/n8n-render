services:
  - type: web
    name: n8n-saas
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: true
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        generateValue: true
      - key: N8N_HOST
        value: n8n-saas.onrender.com
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://n8n-saas.onrender.com/
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: GENERIC_TIMEZONE
        value: America/New_York
      - key: EXECUTIONS_PROCESS
        value: main
      - key: EXECUTIONS_TIMEOUT
        value: 300
      - key: EXECUTIONS_TIMEOUT_MAX
        value: 3600
      - key: N8N_PAYLOAD_SIZE_MAX
        value: 16
      - key: N8N_LOG_LEVEL
        value: info
      - key: N8N_PERSONALIZATION_ENABLED
        value: true
      - key: DB_TYPE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password

databases:
  - name: n8n-db
    databaseName: n8n
    plan: starter
    region: oregon
